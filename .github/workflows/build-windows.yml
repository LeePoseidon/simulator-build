name: Build Eden (patched SDL2)

# 放在仓库的 .github/workflows/build-windows.yml
# 用法：仓库页面 -> Actions -> 左侧 "Build Eden (patched SDL2)" -> Run workflow
# 产物：运行结束后在该次 run 页面底部 Artifacts 里下载 eden-beitong-fix

on:
  workflow_dispatch:
    inputs:
      eden_ref:
        description: "Eden 的 tag/分支（默认 v0.2.1）"
        required: false
        default: "v0.2.1"
      sdl_version:
        description: "SDL2 源码版本（默认 2.32.10）"
        required: false
        default: "2.32.10"

jobs:
  build:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 300

    steps:
      - name: Checkout（只为拿到补丁文件）
        uses: actions/checkout@v5

      - name: 克隆 Eden 源码
        shell: pwsh
        run: |
          $ref = "${{ github.event.inputs.eden_ref }}"
          if ([string]::IsNullOrWhiteSpace($ref)) { $ref = "v0.2.1" }
          Write-Host "Eden ref = $ref"
          git clone --depth 1 --branch $ref https://git.eden-emu.dev/eden-emu/eden.git eden
          if ($LASTEXITCODE -ne 0) { throw "克隆 Eden 失败：$ref" }
          git -C eden log -1 --format="commit %H %s"

      - name: 加载 MSVC x64 环境
        shell: pwsh
        run: |
          # 原方案用 ilammy/msvc-dev-cmd@v1，但它的运行时固定是 node20，已被 GitHub 弃用。
          # 这里直接调 vcvars64.bat，把它导出的环境变量写进 GITHUB_ENV 给后续步骤用（动作内部做的也是这件事）。
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "找不到 vswhere.exe，runner 镜像可能变了" }
          $vsPath = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath).Trim()
          if (-not $vsPath) { throw "找不到含 C++ 工具的 Visual Studio" }
          $vcvars = Join-Path $vsPath "VC\Auxiliary\Build\vcvars64.bat"
          if (-not (Test-Path $vcvars)) { throw "找不到 vcvars64.bat：$vcvars" }
          Write-Host "vcvars: $vcvars"

          $lines = cmd /c "call `"$vcvars`" >nul 2>&1 && set"
          $n = 0
          foreach ($line in $lines) {
            $i = $line.IndexOf('=')
            if ($i -lt 1) { continue }        # 跳过 "=C:=..." 这类当前目录伪变量
            $k = $line.Substring(0, $i)
            $v = $line.Substring($i + 1)
            Set-Item -Path "Env:$k" -Value $v -Force
            Add-Content -Path $env:GITHUB_ENV -Value "$k=$v"
            $n++
          }
          if ($n -lt 20) { throw "vcvars 环境变量导入异常，只有 $n 条" }
          Write-Host "已导入 $n 个环境变量"
          $cl = Get-Command cl.exe -ErrorAction SilentlyContinue
          if (-not $cl) { throw "导入环境后仍找不到 cl.exe" }
          Write-Host "cl.exe = $($cl.Source)"
          $global:LASTEXITCODE = 0

      - name: 安装 Vulkan SDK
        # Eden 的脚本用了 PS7 已移除的 Get-WmiObject，必须走 Windows PowerShell 5.1
        shell: powershell
        run: |
          # Eden 自带脚本，内部会识别 GITHUB_ACTIONS 并写 GITHUB_ENV / GITHUB_PATH
          Push-Location eden
          try {
            ./tools/windows/install-vulkan-sdk.ps1
          } finally {
            Pop-Location
          }
          # 注意：脚本提前 return 时 $LASTEXITCODE 可能是 $null，不能用 -ne 0 判断
          if ($LASTEXITCODE) { throw "Vulkan SDK 安装失败（exit $LASTEXITCODE）" }
          Write-Host "VULKAN_SDK = $env:VULKAN_SDK"

      - name: 下载并修补 SDL2 源码
        shell: pwsh
        run: |
          $ver = "${{ github.event.inputs.sdl_version }}"
          if ([string]::IsNullOrWhiteSpace($ver)) { $ver = "2.32.10" }
          Write-Host "SDL version = $ver"

          # Windows runner 的全局 core.autocrlf 可能是 true，会把源码检出成 CRLF，
          # 导致 LF 格式的补丁匹配不上。这里强制按 LF 检出。
          git -c core.autocrlf=false -c core.eol=lf clone --depth 1 --branch "release-$ver" https://github.com/libsdl-org/SDL.git sdl
          if ($LASTEXITCODE -ne 0) { throw "克隆 SDL 失败：release-$ver" }

          $patch = Join-Path $PWD "patches/0001-sdl2-switch-imu-calibration-fallback.patch"
          git -c core.autocrlf=false -C sdl apply --verbose $patch
          if ($LASTEXITCODE -ne 0) {
            Write-Host "首次应用失败，改用 --ignore-whitespace 重试"
            git -c core.autocrlf=false -C sdl apply --ignore-whitespace --verbose $patch
            if ($LASTEXITCODE -ne 0) { throw "SDL 补丁应用失败" }
          }

          # 自检：确认补丁真的进去了
          $hit = Select-String -Path "sdl/src/joystick/hidapi/SDL_hidapi_switch.c" -Pattern "defaultGyroScale"
          if (-not $hit) { throw "补丁未生效：源码里找不到 defaultGyroScale" }
          Write-Host "补丁生效，命中 $($hit.Count) 处"
          git -C sdl diff --stat

      - name: 编译并安装 SDL2（静态库）
        shell: pwsh
        run: |
          $root = (Get-Location).Path -replace '\\','/'
          cmake -S sdl -B sdl-build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DSDL_SHARED=OFF -DSDL_STATIC=ON `
            -DSDL_TEST=OFF -DSDL_TESTS=OFF `
            -DSDL_HIDAPI=ON -DSDL_JOYSTICK=ON -DSDL_SENSOR=ON `
            -DCMAKE_INSTALL_PREFIX="$root/sdl-install"
          if ($LASTEXITCODE -ne 0) { throw "SDL 配置失败" }

          cmake --build sdl-build
          if ($LASTEXITCODE -ne 0) { throw "SDL 编译失败" }

          cmake --install sdl-build
          if ($LASTEXITCODE -ne 0) { throw "SDL 安装失败" }

          Get-ChildItem -Recurse sdl-install -Include *.lib,*-config.cmake |
            Select-Object -ExpandProperty FullName

      - name: 配置 Eden
        shell: pwsh
        run: |
          $root = (Get-Location).Path -replace '\\','/'
          $cmakeArgs = @(
            "-S","eden","-B","build","-G","Ninja",
            "-DCMAKE_BUILD_TYPE=Release",
            "-DYUZU_TESTS=OFF",
            "-DYUZU_CMD=OFF",
            "-DENABLE_QT=ON",
            "-DYUZU_USE_BUNDLED_SDL2=OFF",
            "-DYUZU_USE_EXTERNAL_SDL2=OFF",
            "-DCMAKE_PREFIX_PATH=$root/sdl-install"
          )
          $log = Join-Path $PWD "configure.log"

          # Eden 的 ENABLE_QT_TRANSLATION 默认是 OFF，关掉后 dist/languages/*.ts 根本不参与编译，
          # 界面就只有英文、语言下拉框也只有 English。这里显式打开。
          Write-Host "===== 配置（含翻译）====="
          cmake @cmakeArgs "-DENABLE_QT_TRANSLATION=ON" 2>&1 | Tee-Object -FilePath $log
          $ok = ($LASTEXITCODE -eq 0)

          if (-not $ok) {
            # 内置 Qt 是 crueter-ci/Qt 的裁剪版，正常带 qttools（LinguistTools），
            # 万一这版没带，就退回不编译翻译，保证能出包。
            if (Select-String -Path $log -Pattern "LinguistTools" -Quiet) {
              Write-Host "===== 内置 Qt 不含 LinguistTools，退回不编译翻译（界面会是英文）====="
              cmake @cmakeArgs "-DENABLE_QT_TRANSLATION=OFF" 2>&1 | Tee-Object -FilePath $log -Append
              $ok = ($LASTEXITCODE -eq 0)
            }
          }

          if (-not $ok) {
            Write-Host "===== 配置失败，以下是 CMake 关键日志 ====="
            if (Test-Path build/CMakeFiles/CMakeError.log) { Get-Content build/CMakeFiles/CMakeError.log -Tail 80 }
            throw "Eden 配置失败"
          }

          # 自检：翻译资源 languages.qrc 是否真的生成了
          $qrc = Get-ChildItem -Recurse build -Filter "languages.qrc" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($qrc) {
            Write-Host "翻译资源已生成：$($qrc.FullName)"
            Write-Host "语言数量：$((Select-String -Path $qrc.FullName -Pattern '<file>').Count)"
          } else {
            Write-Host "警告：没有生成 languages.qrc，界面可能仍然只有英文"
          }

      - name: 编译 Eden
        shell: pwsh
        run: |
          # -k 0：出错不立刻停，一次性把所有编译错误暴露出来
          $log = Join-Path $PWD "build.log"
          cmake --build build --parallel -- -k 0 2>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Write-Host ""
            Write-Host "==================== 编译错误汇总 ===================="
            $codes = Select-String -Path $log -Pattern "error ([A-Z]+[0-9]+)" -AllMatches |
                       ForEach-Object { $_.Matches } | ForEach-Object { $_.Groups[1].Value } |
                       Group-Object | Sort-Object Count -Descending
            Write-Host "按错误码分组："
            foreach ($c in $codes) { Write-Host ("  {0,-10} x{1}" -f $c.Name, $c.Count) }

            $files = Select-String -Path $log -Pattern "([A-Za-z]:)?([A-Za-z0-9_\\/.-]+\.(c|cpp|cc|h))\([0-9]+\): error" -AllMatches |
                       ForEach-Object { $_.Matches } | ForEach-Object { $_.Value -replace '\([0-9]+\): error.*$','' } |
                       Sort-Object -Unique
            Write-Host "出错文件："
            foreach ($f in $files) { Write-Host "  $f" }

            Write-Host "前 40 条明细："
            $errs = Select-String -Path $log -Pattern "error [A-Z]+[0-9]+:|error:|FAILED:" | Select-Object -First 40
            foreach ($e in $errs) { Write-Host $e.Line }
            Write-Host "======================================================"
            throw "Eden 编译失败（exit $code）；完整日志见 Artifacts/build-log"
          }

      - name: 上传编译日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: build-log
          path: |
            build.log
            configure.log
          retention-days: 7
          if-no-files-found: ignore

      - name: 收集产物
        shell: pwsh
        run: |
          if (-not (Test-Path "build/bin/eden.exe")) {
            Write-Host "build/bin 内容："
            Get-ChildItem -Recurse build/bin -ErrorAction SilentlyContinue | Select-Object FullName
            throw "没找到 build/bin/eden.exe"
          }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Recurse -Force build/bin/* dist/
          Get-ChildItem -Recurse dist | Select-Object FullName, Length

      - name: 上传产物
        uses: actions/upload-artifact@v6
        with:
          name: eden-beitong-fix
          path: dist
          retention-days: 7
          if-no-files-found: error
