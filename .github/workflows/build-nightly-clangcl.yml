name: Build Eden Nightly (clang-cl)

# 上传到仓库的 .github/workflows/build-nightly-clangcl.yml
# 用法：Actions -> 左侧 "Build Eden Nightly (clang-cl)" -> Run workflow
# 产物：Artifacts -> eden-nightly-clangcl-beitong-fix
#
# 【这条路线是什么】
#   夜版 = master 分支。master 已从 SDL2 迁到 SDL3，所以用 SDL3 版补丁。
#   clang-cl = clang 前端 + MSVC ABI，是 Eden 官方 Windows 版的编译器路径：
#     - CMakeLists.txt 里 `if (MSVC AND CXX_CLANG)` 分支专门链接 eden-emu/llvm-mingw
#       提供的 libclang_rt.builtins-x86_64.a，并为 opus 加 -Wno-implicit-function-declaration
#     - `if (MSVC AND NOT CXX_CLANG)` 才加 /we####、/W3、/WX-，所以 clang-cl 天生没有
#       “警告即错误”问题（C4505 / C4800 这类不会出现）
#   它仍然使用 MSVC 的 link.exe、Windows SDK、UCRT，所以 MSVC 版的 Qt / ffmpeg / Vulkan
#   全部可直接复用，不需要另起一套工具链。
#
# 【为什么夜版只有 clang-cl 这一条】
#   曾经还有一份「夜版 + 纯 MSVC」的 workflow，已删除。纯 MSVC 需要持续替上游做适配
#   （/we#### 降级 + ninja 清洗），而官方根本不走这条路；clang-cl 只换前端、ABI 与依赖
#   都不变，已实测能完整编译（2106 个目标）并正常运行。
#   本文件不包含 /we#### 降级步骤（clang-cl 用不到），但包含 SDL3 补丁与 0002 补丁。

on:
  workflow_dispatch:
    inputs:
      eden_ref:
        description: "Eden 的 tag/分支/提交（默认 master = 夜版）"
        required: false
        default: "master"
      sdl_version:
        description: "SDL3 源码版本（官方夜版对齐 3.4.14）"
        required: false
        default: "3.4.14"

concurrency:
  group: nightly-clangcl-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Windows x64 (nightly / clang-cl)
    # 必须 windows-2025：它默认带 Visual Studio 2026（STL 14.50+）。
    # 夜版的 Qt 6.11.1 预编译包是用 VS 2026 的 STL 编的，会引用 __std_rotate /
    # __std_unique_4 / __std_replace_copy_1 等新符号；windows-2022（VS 2022 17.14，
    # STL 14.44）里没有这些符号，链接必然 undefined symbol。
    runs-on: windows-2025
    timeout-minutes: 300

    steps:
      - name: Checkout（只为拿到补丁文件）
        uses: actions/checkout@v5

      # ── 坑位 0：补丁文件没上传就开跑，会在十几分钟后才失败。提前拦住。 ──
      - name: 前置检查：补丁文件是否齐全
        shell: pwsh
        run: |
          $need = @(
            "patches/0001-sdl3-switch-imu-calibration-fallback.patch",
            "patches/0002-eden-msvc-static-cast.patch"
          )
          foreach ($p in $need) {
            if (-not (Test-Path $p)) { throw "缺少补丁文件：$p（请先上传到仓库对应路径）" }
            Write-Host ("OK  {0}  {1} 字节" -f $p, (Get-Item $p).Length)
          }

      - name: 克隆 Eden 源码并应用补丁
        shell: pwsh
        run: |
          $ref = "${{ github.event.inputs.eden_ref }}"
          if ([string]::IsNullOrWhiteSpace($ref)) { $ref = "master" }
          Write-Host "Eden ref = $ref"

          git clone --depth 1 --branch $ref https://git.eden-emu.dev/eden-emu/eden.git eden
          if ($LASTEXITCODE -ne 0) { throw "克隆 Eden 失败：$ref" }

          # ── 坑位 2：reinterpret_cast<u64>(ULONG_PTR) ──
          # ExceptionInformation[] 的类型是 ULONG_PTR。MSVC 把 unsigned __int64 与
          # unsigned long long 当作不同类型，reinterpret_cast 非法 → C2440。
          # 官方只用 clang 系列构建，所以上游从不报错。这里打 0002 补丁改成 static_cast。
          #
          # ── 坑位 14：手柄断开重连后体感失效 ──
          # SDL3 的 sensor_timestamp 来自每个设备上下文的计数器（从 0 开始累加），
          # 手柄关机重连 = 新上下文 = 时间戳回到 0；而 Eden 的 SDLJoystick 对象在重连时
          # 被复用、last_motion_update 保留着上一场的高值，于是每帧都被 "时间戳倒退" 判断
          # 丢弃，体感彻底静默（按键摇杆不受影响）。0003 补丁在重连时重置基线。
          # 只应用"当前有效"的 Eden 补丁；显式排除已作废的
          # 0002-eden-allow-sdl2-build-from-source（它只对 SDL2 那条路线有意义，
          # 拿来打 master 会失败）。新加 0004-eden-*.patch 会被自动带上。
          $edenPatches = Get-ChildItem -Path "patches" -Filter "*-eden-*.patch" -ErrorAction SilentlyContinue |
                         Where-Object { $_.Name -notlike "*allow-sdl2*" } |
                         Sort-Object Name
          if (-not $edenPatches) { throw "patches/ 下没找到任何有效 Eden 补丁（至少应有 0002-eden-msvc-static-cast）" }
          Write-Host "待应用的 Eden 补丁：$($edenPatches.Name -join ', ')"
          foreach ($p in $edenPatches) {
            Write-Host "应用 Eden 补丁：$($p.Name)"
            git -c core.autocrlf=false -C eden apply --verbose $p.FullName
            if ($LASTEXITCODE -ne 0) {
              Write-Host "首次应用失败，改用 --ignore-whitespace 重试"
              git -c core.autocrlf=false -C eden apply --ignore-whitespace --verbose $p.FullName
              if ($LASTEXITCODE -ne 0) { throw "Eden 补丁应用失败：$($p.Name)（master 该行可能改过，需重新对位）" }
            }
          }
          if (-not (Select-String -Path "eden/src/common/sparse_large_vector.cpp" -Pattern "static_cast<u64>" -Quiet)) {
            throw "Eden 补丁未生效：sparse_large_vector.cpp 里找不到 static_cast<u64>"
          }
          # 反向确认：旧的非法写法必须已经消失
          if (Select-String -Path "eden/src/common/sparse_large_vector.cpp" -Pattern "reinterpret_cast<u64>\(info->ExceptionRecord" -Quiet) {
            throw "Eden 补丁未生效：旧的 reinterpret_cast<u64> 仍在"
          }

          # ── 自查 0003：重连体感修复必须真的落进源码 ──
          $sdlDrv = "eden/src/input_common/drivers/sdl_driver.cpp"
          if (-not (Test-Path $sdlDrv)) { throw "找不到 $sdlDrv" }
          if (-not (Select-String -Path $sdlDrv -Pattern "last_motion_update = 0;" -Quiet)) {
            throw "0003 补丁未生效：sdl_driver.cpp 里找不到 last_motion_update = 0;（重连后体感仍会失效）"
          }
          if (-not (Select-String -Path $sdlDrv -Pattern "1'000'000'000ULL" -Quiet)) {
            throw "0003 补丁未生效：找不到时间戳倒退的容差判断"
          }
          Write-Host "Eden 补丁已生效（0002 static_cast + 0003 体感时间戳重置）"

          $commit = (git -C eden rev-parse HEAD).Trim()
          $branch = (git -C eden rev-parse --abbrev-ref HEAD).Trim()
          if ($branch -eq "HEAD") { $branch = $ref }

          # GetSCMRev 会优先读这三个文件，写进去就不用整仓库完整历史（223MB）
          Set-Content -Path eden/GIT-COMMIT  -Value $commit -NoNewline -Encoding ascii
          Set-Content -Path eden/GIT-REFSPEC -Value $branch -NoNewline -Encoding ascii
          Set-Content -Path eden/GIT-TAG     -Value $branch -NoNewline -Encoding ascii

          Write-Host "commit = $commit / ref = $branch"
          git -C eden log -1 --format="%ad | %s" --date=short

      # ── 坑位 5：ilammy/msvc-dev-cmd@v1 的运行时是 node20，已被 GitHub 弃用 ──
      # 换成手写 vcvars：它内部做的也是同一件事。clang-cl 同样需要 MSVC 的头文件、
      # 库、link.exe 和 Windows SDK，所以这一步两条路线都要保留。
      - name: 加载 MSVC x64 环境（clang-cl 也依赖它提供 SDK/CRT/link.exe）
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "找不到 vswhere.exe，runner 镜像可能变了" }
          $vsPath = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath).Trim()
          if (-not $vsPath) { throw "找不到含 C++ 工具的 Visual Studio" }

          # ── 坑位 10：必须确认拿到的是 VS 2026（STL 14.50+），否则链接 Qt 6.11.1 会缺 __std_* ──
          Write-Host "Visual Studio 安装路径：$vsPath"
          $ver = (& $vswhere -latest -products * -property catalog_productDisplayVersion | Out-String).Trim()
          Write-Host "Visual Studio 版本：$ver"
          if ($vsPath -match '\\2022\\') {
            Write-Host "::warning title=VS 版本偏旧::检测到 Visual Studio 2022；夜版 Qt 6.11.1 需要 VS 2026 的 STL，链接大概率会缺 __std_* 符号"
          }

          $vcvars = Join-Path $vsPath "VC\Auxiliary\Build\vcvars64.bat"
          if (-not (Test-Path $vcvars)) { throw "找不到 vcvars64.bat：$vcvars" }
          Write-Host "vcvars: $vcvars"

          $lines = cmd /c "call `"$vcvars`" >nul 2>&1 && set"
          $n = 0
          foreach ($line in $lines) {
            $i = $line.IndexOf('=')
            if ($i -lt 1) { continue }        # 跳过 "=C:=..." 这类当前目录伪变量
            $k = $line.Substring(0, $i)
            $v = $line.Substring($i + 1)
            Set-Item -Path "Env:$k" -Value $v -Force
            Add-Content -Path $env:GITHUB_ENV -Value "$k=$v"
            $n++
          }
          # ── 坑位 7：$LASTEXITCODE 为 $null 时不能用 -ne 0 判断，这里也不用它判成败 ──
          if ($n -lt 20) { throw "vcvars 环境变量导入异常，只有 $n 条" }
          Write-Host "已导入 $n 个环境变量"
          $cl = Get-Command cl.exe -ErrorAction SilentlyContinue
          if (-not $cl) { throw "导入环境后仍找不到 cl.exe" }
          Write-Host "cl.exe = $($cl.Source)"
          $global:LASTEXITCODE = 0

      - name: 准备 clang-cl
        shell: pwsh
        run: |
          $candidates = @(
            "C:\Program Files\LLVM\bin\clang-cl.exe",
            "C:\Program Files\Microsoft Visual Studio\2026\Enterprise\VC\Tools\Llvm\x64\bin\clang-cl.exe",
            "C:\Program Files\Microsoft Visual Studio\2026\Community\VC\Tools\Llvm\x64\bin\clang-cl.exe",
            "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\Llvm\x64\bin\clang-cl.exe",
            "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\Llvm\bin\clang-cl.exe"
          )
          $clang = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $clang) {
            $cmd = Get-Command clang-cl.exe -ErrorAction SilentlyContinue
            if ($cmd) { $clang = $cmd.Source }
          }
          if (-not $clang) { throw "runner 上找不到 clang-cl.exe（windows-2025 镜像应自带 LLVM）" }

          $out = (& $clang --version 2>&1 | Out-String).Trim()
          Write-Host "clang-cl = $clang"
          Write-Host $out
          if ($out -notmatch 'clang version (\d+)') { throw "无法识别 clang-cl 版本输出" }

          $dir = Split-Path $clang -Parent
          Add-Content -Path $env:GITHUB_PATH -Value $dir
          Add-Content -Path $env:GITHUB_ENV  -Value "CC=$clang"
          Add-Content -Path $env:GITHUB_ENV  -Value "CXX=$clang"
          $env:CC = $clang
          $env:CXX = $clang
          $global:LASTEXITCODE = 0

      # ── 坑位 6：Eden 的脚本用了 PowerShell 7 已移除的 Get-WmiObject，必须走 5.1 ──
      - name: 安装 Vulkan SDK
        shell: powershell
        run: |
          Push-Location eden
          try {
            ./tools/windows/install-vulkan-sdk.ps1
          } finally {
            Pop-Location
          }
          # 脚本提前 return 时 $LASTEXITCODE 可能是 $null，不能用 -ne 0 判断
          if ($LASTEXITCODE) { throw "Vulkan SDK 安装失败（exit $LASTEXITCODE）" }
          Write-Host "VULKAN_SDK = $env:VULKAN_SDK"

      # ── 坑位 1：SDL3 的 LoadIMUCalibration 对全 0 标定数据没有兜底 ──
      # 北通等克隆手柄在 Switch 模式下伪装 057E:2009，SPI 标定区读回全 0，
      # 导致 MULT/(coeff-raw) 除零 → inf/NaN → 体感恒为 0（按键摇杆不受影响）。
      - name: 下载并修补 SDL3 源码
        shell: pwsh
        run: |
          $ver = "${{ github.event.inputs.sdl_version }}"
          if ([string]::IsNullOrWhiteSpace($ver)) { $ver = "3.4.14" }
          Write-Host "SDL3 version = $ver"

          # ── 坑位 8：runner 的全局 core.autocrlf 可能是 true，会把源码检出成 CRLF，
          #             导致 LF 补丁打不上。clone 与 apply 都要显式关掉。 ──
          git -c core.autocrlf=false -c core.eol=lf clone --depth 1 --branch "release-$ver" https://github.com/libsdl-org/SDL.git sdl3
          if ($LASTEXITCODE -ne 0) { throw "克隆 SDL3 失败：release-$ver" }

          $patch = Join-Path $PWD "patches/0001-sdl3-switch-imu-calibration-fallback.patch"
          git -c core.autocrlf=false -C sdl3 apply --verbose $patch
          if ($LASTEXITCODE -ne 0) {
            Write-Host "首次应用失败，改用 --ignore-whitespace 重试"
            git -c core.autocrlf=false -C sdl3 apply --ignore-whitespace --verbose $patch
            if ($LASTEXITCODE -ne 0) { throw "SDL3 补丁应用失败（版本 $ver 与补丁不匹配？）" }
          }

          # 自检：补丁必须真的落进去了（6 个 scale 赋值点 + 2 个默认值）
          $hit = Select-String -Path "sdl3/src/joystick/hidapi/SDL_hidapi_switch.c" -Pattern "defaultGyroScale"
          if (-not $hit) { throw "补丁未生效：SDL_hidapi_switch.c 里找不到 defaultGyroScale" }
          Write-Host "补丁生效，命中 $($hit.Count) 处"
          $div = Select-String -Path "sdl3/src/joystick/hidapi/SDL_hidapi_switch.c" -Pattern "fGyroDivX > 0\.0f"
          if (-not $div) { throw "补丁不完整：找不到除零兜底判断 fGyroDivX > 0.0f" }
          git -C sdl3 diff --stat

      # ── 坑位 9：ENABLE_QT_TRANSLATION 默认 OFF，界面只剩英文 ──
      - name: 配置 Eden（SDL3 走源码树 + 静态 + clang-cl）
        shell: pwsh
        run: |
          $root = (Get-Location).Path -replace '\\','/'
          $cmakeArgs = @(
            "-S","eden","-B","build","-G","Ninja",
            "-DCMAKE_BUILD_TYPE=Release",
            "-DCMAKE_C_COMPILER=clang-cl",
            "-DCMAKE_CXX_COMPILER=clang-cl",
            "-DYUZU_TESTS=OFF",
            "-DYUZU_CMD=OFF",
            "-DENABLE_QT=ON",
            "-DYUZU_USE_BUNDLED_SDL3=OFF",
            "-DSDL3_CUSTOM_DIR=$root/sdl3",
            "-DSDL_SHARED=OFF","-DSDL_STATIC=ON",
            "-DSDL_TESTS=OFF","-DSDL_TEST_LIBRARY=OFF"
          )
          $log = Join-Path $PWD "configure.log"

          Write-Host "===== 配置（含翻译）====="
          cmake @cmakeArgs "-DENABLE_QT_TRANSLATION=ON" 2>&1 | Tee-Object -FilePath $log
          $ok = ($LASTEXITCODE -eq 0)

          if (-not $ok) {
            # 内置 Qt 是裁剪版，正常带 qttools（LinguistTools）；万一没带就退回英文，保证能出包
            if (Select-String -Path $log -Pattern "LinguistTools" -Quiet) {
              Write-Host "===== 内置 Qt 不含 LinguistTools，退回不编译翻译（界面会是英文）====="
              cmake @cmakeArgs "-DENABLE_QT_TRANSLATION=OFF" 2>&1 | Tee-Object -FilePath $log -Append
              $ok = ($LASTEXITCODE -eq 0)
            }
          }

          if (-not $ok) {
            Write-Host "===== 配置失败，CMake 关键日志 ====="
            if (Test-Path build/CMakeFiles/CMakeError.log) { Get-Content build/CMakeFiles/CMakeError.log -Tail 100 }
            if (Test-Path build/CMakeFiles/CMakeOutput.log) { Get-Content build/CMakeFiles/CMakeOutput.log -Tail 40 }
            throw "Eden 配置失败"
          }

          # ── 硬自检：编译器必须真的是 clang-cl（不能静默退回 MSVC，否则坑位 3 会复现）──
          $idline = Select-String -Path $log -Pattern "The CXX compiler identification is" | Select-Object -First 1
          if (-not $idline) { throw "配置日志里找不到 CXX compiler identification，无法确认编译器" }
          Write-Host $idline.Line.Trim()
          if ($idline.Line -notmatch "Clang") {
            throw "期望 clang-cl，实际识别为：$($idline.Line.Trim())（检查 CC/CXX 与 -DCMAKE_CXX_COMPILER）"
          }
          $cache = Get-Content build/CMakeCache.txt -Raw
          if ($cache -notmatch '(?m)^CMAKE_CXX_COMPILER:.*clang-cl') {
            throw "CMakeCache 里的 CMAKE_CXX_COMPILER 不是 clang-cl"
          }
          Write-Host "确认：正在用 clang-cl 构建"

          # 自检：确认真的用了我们修补后的 SDL3 源码目录
          if ($cache -notmatch 'SDL3_CUSTOM_DIR') { throw "CMakeCache 里没有 SDL3_CUSTOM_DIR" }
          Select-String -Path build/CMakeCache.txt -Pattern '^SDL3_CUSTOM_DIR|^YUZU_USE_BUNDLED_SDL3|^SDL_SHARED|^SDL_STATIC|^ENABLE_QT_TRANSLATION' |
            ForEach-Object { Write-Host $_.Line }

          # 自检：翻译资源 languages.qrc 是否真的生成了
          $qrc = Get-ChildItem -Recurse build -Filter "languages.qrc" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($qrc) {
            $langs = (Select-String -Path $qrc.FullName -Pattern '<file>').Count
            Write-Host "翻译资源已生成：$($qrc.FullName)"
            Write-Host "语言数量：$langs"
            if ($langs -lt 20) { Write-Host "::warning title=语言数量偏少::只有 $langs 个语言，预期 27~29 个" }
          } else {
            Write-Host "::warning title=未生成翻译资源::没有 languages.qrc，界面可能仍然只有英文"
          }

      # ── 坑位 11：一轮只暴露一个错，改为 -k 0 一次性列全 ──
      - name: 编译 Eden
        shell: pwsh
        run: |
          $log = Join-Path $PWD "build.log"
          cmake --build build --parallel -- -k 0 2>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Write-Host ""
            Write-Host "==================== 编译错误汇总 ===================="
            $codes = Select-String -Path $log -Pattern "error ([A-Z]+[0-9]+)" -AllMatches |
                       ForEach-Object { $_.Matches } | ForEach-Object { $_.Groups[1].Value } |
                       Group-Object | Sort-Object Count -Descending
            Write-Host "按错误码分组："
            foreach ($c in $codes) { Write-Host ("  {0,-10} x{1}" -f $c.Name, $c.Count) }

            $files = Select-String -Path $log -Pattern "([A-Za-z]:)?([A-Za-z0-9_\\/.-]+\.(c|cpp|cc|h))\([0-9]+\): error" -AllMatches |
                       ForEach-Object { $_.Matches } | ForEach-Object { $_.Value -replace '\([0-9]+\): error.*$','' } |
                       Sort-Object -Unique
            Write-Host "出错文件："
            foreach ($f in $files) { Write-Host "  $f" }

            Write-Host "前 40 条明细："
            $errs = Select-String -Path $log -Pattern "error [A-Z]+[0-9]+:|error:|FAILED:" | Select-Object -First 40
            foreach ($e in $errs) { Write-Host $e.Line }
            Write-Host "======================================================"

            # ── 已知坑位的定向提示，避免再猜一遍 ──
            if (Select-String -Path $log -Pattern "undefined symbol: __std_" -Quiet) {
              Write-Host ""
              Write-Host "【诊断·坑位10】链接缺少 __std_* 符号 = 当前 VS 的 STL 版本低于 Qt 6.11.1 编译时用的版本。"
              Write-Host "        需要 VS 2026（runs-on: windows-2025）；检查上面打印的 Visual Studio 版本。"
            }
            if (Select-String -Path $log -Pattern "error C4505|error C4800" -Quiet) {
              Write-Host ""
              Write-Host "【诊断·坑位3】出现 C4505/C4800 = Eden 的 /we#### 生效了。"
              Write-Host "        这在 clang-cl 下不应发生，请检查 CMAKE_CXX_COMPILER 是否真的被设为 clang-cl。"
            }
            throw "Eden 编译失败（exit $code）；完整日志见 Artifacts/build-log"
          }

      - name: 上传编译日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: build-log-clangcl
          path: |
            build.log
            configure.log
          retention-days: 7
          if-no-files-found: ignore

      - name: 收集产物
        shell: pwsh
        run: |
          if (-not (Test-Path "build/bin/eden.exe")) {
            Write-Host "build/bin 内容："
            Get-ChildItem -Recurse build/bin -ErrorAction SilentlyContinue | Select-Object FullName
            throw "没找到 build/bin/eden.exe"
          }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Recurse -Force build/bin/* dist/

          # 静态链接的话不需要 SDL3.dll；万一退化成了动态库，把它一起带上免得产物跑不起来
          if (Test-Path "dist/SDL3.dll") {
            Write-Host "确认：动态链接，SDL3.dll 已在产物里"
          } else {
            $dll = Get-ChildItem -Path build -Recurse -Filter SDL3.dll -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($dll) {
              Write-Host "警告：链接的是动态库，补上 $($dll.FullName)"
              Copy-Item $dll.FullName dist/
            } else {
              Write-Host "确认：静态链接，无需 SDL3.dll"
            }
          }

          # 附带一份构建信息，方便日后回看是哪次提交、哪个编译器
          $info = @(
            "eden_ref   = ${{ github.event.inputs.eden_ref }}",
            "sdl_version= ${{ github.event.inputs.sdl_version }}",
            "compiler   = clang-cl",
            "run        = ${{ github.run_id }}",
            "commit     = ${{ github.sha }}"
          ) -join "`r`n"
          Set-Content -Path dist/BUILD-INFO.txt -Value $info -Encoding utf8

          Get-ChildItem -Recurse dist | Select-Object FullName, Length

      - name: 上传产物
        uses: actions/upload-artifact@v6
        with:
          name: eden-nightly-clangcl-beitong-fix
          path: dist
          retention-days: 7
          if-no-files-found: error
